<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{{ $style := resources.Get "sass/main.scss" | resources.ExecuteAsTemplate "scss/main.scss" . | toCSS (dict "outputStyle" "compressed") }}
{{ $style.Content | safeCSS }}
{{ readFile "static/css/posts.css" | safeCSS }}
{{ readFile "static/css/header.css" | safeCSS }}
{{ readFile "static/css/custom.css" | safeCSS }}
</style>
</head>
<body>
<div style="max-width:788px; margin:0 auto; background:#ffffff; padding:24px;">
<article>
<h1>{{ .Title }}</h1>
{{ .Content }}
</article>
<hr>
<p style="font-size:12px;color:#888;">
  {{ safeHTML "<a href=\"{{ unsubscribe_url }}\">Unsubscribe</a>" }}
</p>
</div>
</body>
</html>
